[versions]
agp = "9.1.1"
kotlin = "2.3.0"
ksp = "2.3.2"
media3 = "1.9.1"
room = "2.8.4"
core-ktx = "1.17.0"
activity-ktx = "1.10.1"
concurrent-futures-ktx = "1.3.0"
transition-ktx = "1.6.0"
fragment-ktx = "1.8.9"
splashscreen = "1.2.0"
lifecycle = "2.10.0"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
preference-ktx = "1.2.1"
material = "1.13.0"
flexbox = "3.0.0"
fastscroll = "1.3.0"
coil = "3.3.0"
profileinstaller = "1.4.1"
leakcanary = "2.14"
junit = "4.13.2"

[libraries]
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }
concurrent-futures-ktx = { module = "androidx.concurrent:concurrent-futures-ktx", version.ref = "concurrent-futures-ktx" }
transition-ktx = { module = "androidx.transition:transition-ktx", version.ref = "transition-ktx" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-midi = { module = "androidx.media3:media3-exoplayer-midi", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference-ktx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }
fastscroll = { module = "me.zhanghai.android.fastscroll:library", version.ref = "fastscroll" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
